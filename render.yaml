services:
  - type: web
    name: openmnc-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: amit@openmnc.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: VERCEL_DEPLOY_HOOK_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_APPS_SCRIPT_WEBHOOK_URL
        sync: false
